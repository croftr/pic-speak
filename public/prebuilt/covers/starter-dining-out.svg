<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="diningGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="url(#diningGrad)" />
  
  <!-- Plate -->
  <circle cx="50" cy="50" r="30" fill="#ffffff" />
  <circle cx="50" cy="50" r="24" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5" />
  
  <!-- Fork -->
  <g transform="translate(14, 25)">
    <rect x="2.5" y="10" width="3" height="35" rx="1.5" fill="#9ca3af" />
    <path d="M1,12 L7,12 L6,8 L2,8 Z" fill="#9ca3af" />
    <rect x="1" y="2" width="1.5" height="10" rx="0.5" fill="#9ca3af" />
    <rect x="3.25" y="2" width="1.5" height="10" rx="0.5" fill="#9ca3af" />
    <rect x="5.5" y="2" width="1.5" height="10" rx="0.5" fill="#9ca3af" />
  </g>
  
  <!-- Knife -->
  <g transform="translate(76, 25)">
    <rect x="2.5" y="20" width="3" height="25" rx="1.5" fill="#6b7280" />
    <path d="M2.5,2 Q8,2 4,20 L2.5,20 Z" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.5" />
  </g>
  
  <!-- Slice of Pizza on Plate -->
  <g transform="translate(50, 50) rotate(-30)">
    <polygon points="0,0 -8,-16 8,-16" fill="#facc15" />
    <path d="M-9,-16 Q0,-18 9,-16 L8,-14 Q0,-16 -8,-14 Z" fill="#b45309" />
    <circle cx="-2" cy="-10" r="2" fill="#ef4444" />
    <circle cx="3" cy="-7" r="1.5" fill="#ef4444" />
    <circle cx="0" cy="-3" r="1.2" fill="#ef4444" />
  </g>
</svg>
