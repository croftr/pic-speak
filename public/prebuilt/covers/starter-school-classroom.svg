<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="schoolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="url(#schoolGrad)" />
  
  <!-- Chalkboard -->
  <rect x="15" y="15" width="70" height="42" rx="4" fill="#78350f" />
  <rect x="18" y="18" width="64" height="36" rx="2" fill="#065f46" />
  
  <!-- Chalk writing (ABC + 123) -->
  <path d="M25,25 L28,33 M28,33 L31,25 M26.5,30 L29.5,30" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M36,25 Q38,25 38,27.5 Q38,29 36.5,29.5 L36.5,29.5 Q39,30 39,32.5 Q39,35 36,35 M36,25 L36,35" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M48,25 C43,25 43,35 48,35" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  
  <path d="M57,25 L57,35 M55,27 L57,25" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M62,26 Q64,24 66,26 T63,32 L67,32" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M72,25 Q75,25 74,27.5 T72,30 Q75,30 74,32.5 T72,35" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Chalk piece -->
  <rect x="74" y="49" width="5" height="1.5" rx="0.3" fill="#ffffff" transform="rotate(-15, 74, 49)" />
  
  <!-- Stack of books -->
  <rect x="20" y="70" width="30" height="8" rx="1.5" fill="#3b82f6" />
  <rect x="23" y="70" width="24" height="2" fill="#ffffff" />
  <rect x="22" y="63" width="26" height="7" rx="1.5" fill="#ef4444" />
  <rect x="25" y="63" width="20" height="2" fill="#ffffff" />
  
  <!-- Pencil -->
  <g transform="translate(62, 60) rotate(45)">
    <rect x="0" y="0" width="25" height="6" fill="#facc15" />
    <rect x="-4" y="0" width="4" height="6" fill="#f472b6" rx="0.5" />
    <rect x="-1" y="0" width="1" height="6" fill="#9ca3af" />
    <polygon points="25,0 30,3 25,6" fill="#fed7aa" />
    <polygon points="28,1.8 30,3 28,4.2" fill="#374151" />
  </g>
</svg>
